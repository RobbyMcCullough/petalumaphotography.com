<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
  <!-- TAIL: large sweeping circle - the dominant feature -->
  <circle cx="70" cy="33" r="28" fill="#1c1208"/>

  <!-- BACK: fills gap between neck and tail -->
  <ellipse cx="53" cy="39" rx="15" ry="11" fill="#1c1208"/>

  <!-- BODY: full and round -->
  <ellipse cx="43" cy="66" rx="26" ry="22" fill="#1c1208"/>

  <!-- NECK -->
  <ellipse cx="37" cy="48" rx="10" ry="17" fill="#1c1208"/>

  <!-- HEAD: compact -->
  <circle cx="27" cy="30" r="11" fill="#1c1208"/>

  <!-- COMB: 4 compact bumps -->
  <path d="M 22 20 C 21 14 24 12 26 17 C 26 12 29 11 31 16 C 31 11 34 12 35 17 C 35 12 37 13 38 18 C 36 15 33 14 31 17 C 29 14 26 14 23 20 Z" fill="#1c1208"/>

  <!-- WATTLE: teardrop under chin -->
  <path d="M 17 33 C 14 33 13 37 14 41 C 16 44 20 43 21 40 C 22 37 20 33 17 33 Z" fill="#1c1208"/>

  <!-- BEAK -->
  <polygon points="18,24 7,28 18,32" fill="#1c1208"/>

  <!-- LEFT LEG -->
  <rect x="36" y="86" width="4" height="12" rx="2" fill="#1c1208"/>
  <!-- Left foot toes -->
  <path d="M 27 97 L 40 97" stroke="#1c1208" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 34 97 L 30 107" stroke="#1c1208" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 38 97 L 42 107" stroke="#1c1208" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Spur -->
  <path d="M 36 91 L 30 88" stroke="#1c1208" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- RIGHT LEG -->
  <rect x="48" y="84" width="4" height="12" rx="2" fill="#1c1208"/>
  <!-- Right foot toes -->
  <path d="M 39 95 L 52 95" stroke="#1c1208" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 46 95 L 42 105" stroke="#1c1208" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 50 95 L 54 105" stroke="#1c1208" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- WHITE HIGHLIGHTS -->
  <!-- Tail inner arc - suggests depth of curved feathers -->
  <path d="M 56 59 C 52 48 55 36 63 29" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Wing arc on body -->
  <path d="M 29 68 C 36 59 52 59 58 68" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eye -->
  <circle cx="23" cy="28" r="2.5" fill="white"/>
</svg>
