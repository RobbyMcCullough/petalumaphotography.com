<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer Subtle Ring representing lens elements or exhibition frame -->
  <circle cx="60" cy="60" r="56" stroke="#cda16c" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4" />
  <circle cx="60" cy="60" r="52" stroke="#cda16c" stroke-width="0.6" opacity="0.6" />

  <!-- Camera Body - Subtle, clean geometric lines -->
  <path d="M 32 46 h 56 a 2 2 0 0 1 2 2 v 30 a 2 2 0 0 1 -2 2 h -56 a 2 2 0 0 1 -2 -2 v -30 a 2 2 0 0 1 2 -2 z" stroke="#cda16c" stroke-width="1.2" />
  
  <!-- Shutter Button & Dial Details -->
  <path d="M 38 46 v -3 h 8 v 3" stroke="#cda16c" stroke-width="1" />
  <path d="M 74 46 v -4 h 10 v 4" stroke="#cda16c" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="79" cy="38" r="1.5" fill="#cda16c" />

  <!-- Rangefinder Viewfinder Window -->
  <rect x="76" y="52" width="8" height="5" rx="0.5" stroke="#cda16c" stroke-width="0.8" />
  
  <!-- Lens Rings -->
  <circle cx="60" cy="63" r="18" stroke="#cda16c" stroke-width="1.2" />
  <circle cx="60" cy="63" r="14" stroke="#cda16c" stroke-width="0.8" />
  
  <!-- Detailed Aperture Blades (Intersection Line Work) -->
  <path d="M 60 49 L 69 57 L 67 67 L 55 70 L 51 61 L 56 52 M 56 52 L 60 49" stroke="#cda16c" stroke-width="0.6" opacity="0.8" />
  <line x1="60" y1="49" x2="60" y2="77" stroke="#cda16c" stroke-width="0.5" opacity="0.5" />
  <line x1="42" y1="63" x2="78" y2="63" stroke="#cda16c" stroke-width="0.5" opacity="0.5" />
  <line x1="47.3" y1="50.3" x2="72.7" y2="75.7" stroke="#cda16c" stroke-width="0.5" opacity="0.5" />
  <line x1="72.7" y1="50.3" x2="47.3" y2="75.7" stroke="#cda16c" stroke-width="0.5" opacity="0.5" />

  <!-- Subtle reflection highlights -->
  <path d="M 45 63 A 15 15 0 0 1 60 48" stroke="#dfb887" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M 75 63 A 15 15 0 0 1 60 78" stroke="#dfb887" stroke-width="1" stroke-linecap="round" opacity="0.4" />
</svg>
